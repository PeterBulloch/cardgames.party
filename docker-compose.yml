# Plain HTTP on port 80, for a reverse proxy on this host or another LAN host.
# LAN use with local-ip.sh certificates layers docker-compose.local.yml on top (see CONTRIBUTING.md).
services:
  cards:
    build: .
    image: cards
    ports:
      # Bind to all interfaces so a reverse proxy on another LAN host can reach the app.
      - "${CARDS_BIND_IP:-0.0.0.0}:${CARDS_PORT:-80}:8000"
    restart: unless-stopped
